[package]
name = "deadbolt-ios"
version = "0.1.0"
edition = "2024"
[lib]
name = "deadbolt_ios"
crate-type = ["staticlib", "rlib"]
[dependencies]
deadbolt-core = { path = "../vendor/deadbolt/crates/core", default-features = false }
deadbolt-store = { path = "../vendor/deadbolt/crates/store" }
deadbolt-net = { path = "../vendor/deadbolt/crates/net", features = ["application"] }
anyhow = "1"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zeroize = "1"
time = { version = "0.3", features = ["formatting"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
[dev-dependencies]
tempfile = "3"
[profile.release]
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
netdev = { path = "patches/netdev" }
netwatch = { path = "patches/netwatch" }
