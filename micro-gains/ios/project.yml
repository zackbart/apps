# XcodeGen project definition. This file is the source of truth for the Xcode
# project; MicroGains.xcodeproj is generated and should not be hand-edited.
#
#     brew install xcodegen
#     xcodegen generate
#     open MicroGains.xcodeproj
name: MicroGains
options:
  bundleIdPrefix: com.zackbart
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    # The API base URL is injected into Info.plist as MICRO_GAINS_API_URL and
    # read by APIClient.baseURL. Debug points at the local wrangler dev server.
    debug:
      MICRO_GAINS_API_URL: http://127.0.0.1:8788
    # Production Worker on the One&Many Cloudflare account.
    release:
      MICRO_GAINS_API_URL: https://micro-gains.onemany.workers.dev

targets:
  MicroGains:
    type: application
    platform: iOS
    sources:
      - path: MicroGains
        excludes:
          - Resources/Info.plist
    resources:
      - path: MicroGains/Resources/catalog.json
      - path: MicroGains/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zackbart.microgains
        PRODUCT_NAME: MicroGains
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: F2J8ZU2NQJ
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Info.plist holds only the keys Xcode cannot generate (background
        # modes, BGTask identifiers, the API URL). Everything else comes from
        # the INFOPLIST_KEY_* settings below and is merged in at build time.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: MicroGains/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Micro Gains
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - MicroGainsTests
      gatherCoverageData: true

  MicroGainsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MicroGainsTests
    dependencies:
      - target: MicroGains
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zackbart.microgains.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MicroGains.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MicroGains"
        BUNDLE_LOADER: "$(TEST_HOST)"
