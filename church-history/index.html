<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Church History Map</title>
<meta name="description" content="A map of the Christian church from Jesus to today: the councils, the splits, where each tradition came from, and how their sacraments compare.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="The church, from Jesus to today">
<meta property="og:description" content="Two thousand years of Christian history on one map: the councils, the splits, and where each church came from.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://church-history.onemany.workers.dev/">
<meta property="og:image" content="https://church-history.onemany.workers.dev/og.jpg">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div class="app" id="app" data-view="story">
  <header class="top">
    <div class="brand">
      <h1>The church, from Jesus to today</h1>
      <p class="sub">Two thousand years of Christian history at a glance.</p>
    </div>
    <nav class="views" id="views" aria-label="Views">
      <button type="button" data-view="story" aria-current="true">Story</button>
      <button type="button" data-view="map" aria-current="false">Map</button>
      <button type="button" data-view="church" aria-current="false">My church</button>
      <button type="button" data-view="sacraments" aria-current="false">Sacraments</button>
    </nav>
    <div class="search" id="search">
      <button type="button" class="search-btn" id="search-btn" aria-label="Find a church or council"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
      <input id="q" type="search" placeholder="Find a church or council" autocomplete="off" spellcheck="false" aria-label="Find a church or council">
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>
  </header>

  <main class="views-host">
    <section class="view story-view" id="view-story" aria-label="The story in chapters"></section>

    <section class="view map-view" id="view-map" aria-label="The full map" hidden>
      <div class="map-bar">
        <div class="eras" id="eras" role="group" aria-label="Jump to an era"></div>
        <div class="map-tools">
          <div class="seg" role="group" aria-label="Color the lines by">
            <button type="button" data-mode="plain" aria-pressed="true">Plain</button>
            <button type="button" data-mode="family" aria-pressed="false">Family</button>
            <button type="button" data-mode="eucharist" aria-pressed="false">Communion</button>
          </div>
          <label class="detail">
            <input type="checkbox" id="detail">
            <span class="switch" aria-hidden="true"></span>
            More detail
          </label>
        </div>
      </div>
      <div class="map-scroll"><div class="map-host" id="map-host" tabindex="0" aria-label="Map. Arrow keys move through time, plus and minus zoom."></div></div>
      <p class="map-note" hidden></p>
      <section class="legend" id="legend" aria-label="Color key" hidden></section>
      <p class="hint">Drag to move through time. Scroll or pinch to zoom. Click any line or dot.</p>
    </section>

    <section class="view screen" id="view-church" aria-label="My church" hidden></section>
    <section class="view screen" id="view-sacraments" aria-label="Sacraments" hidden></section>
  </main>

  <aside class="panel" id="panel" hidden aria-live="polite">
    <div class="grab" aria-hidden="true"></div>
    <button type="button" class="close" id="close" aria-label="Close">×</button>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
